<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f0f4f8;display:flex;justify-content:center;padding-top:40px;padding-bottom:40px;}
.wrap{width:680px;background:white;padding:35px;border-radius:12px;box-shadow: 0 4px 14px rgba(0,0,0,0.1);}
h1{text-align:center;color:#2c3e50;margin-bottom:20px;font-size:22px;}
.tip-mode{text-align:center;color:#444;margin-bottom:20px;font-size:17px;}
.stats{display:flex;justify-content:space-around;font-size:17px;margin-bottom:24px;flex-wrap:wrap;gap:8px;}
.hint-block{font-size:32px;font-weight:bold;text-align:center;color:#2980b9;background:#ecf4fc;padding:24px;border-radius:8px;margin-bottom:22px;line-height:1.6;}
#inputBox{width:100%;font-size:22px;padding:14px 16px;border:2px solid #bdc3c7;border-radius:8px;outline:none;}
#inputBox:focus{border-color:#2980b9;}
.tip-text{text-align:center;margin-top:10px;color:#777;}
.feedback{text-align:center;margin-top:18px;font-size:21px;min-height:30px;}
.ok{color:#27ae60;}
.fail{color:#e74c3c;}
#restartBtn{width:100%;margin-top:24px;padding:14px;background:#3498db;border:none;color:white;font-size:18px;border-radius:8px;cursor:pointer;}
.wrong-title{margin-top:28px;font-size:18px;}
.wrong-list{margin-top:10px;color:#c0392b;line-height:1.8;white-space:pre‑line;}
.finish-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:99;}
.finish-box{background:white;padding:40px;border-radius:12px;text-align:center;width:520px;max-width:90%;}
.finish‑wrong{text-align:left;margin-top:20px;line-height:1.7;color:#c0392b;max-height:320px;overflow-y:auto;white-space:pre‑line;}
.finish-box button{margin-top:22px;padding:10px 22px;font-size:17px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
    <h1>📝</h1>
    <div class="tip-mode">当前：随机题型（音标/中文/单词互译）</div>
    <div class="stats">
        <div>✅正确：<span id="rightCount">0</span></div>
        <div>❌错误：<span id="errCount">0</span></div>
        <div>正确率：<span id="rate">0%</span></div>
        <div>🔹剩余：<span id="remain">0</span></div>
    </div>
    <div class="hint-block" id="showHint">点击开始练习</div>
    <input type="text" id="inputBox" autocomplete="off" spellcheck="false" placeholder="输入答案，回车提交">
    <div class="tip-text">输入完成按下回车键</div>
    <div class="feedback" id="feedbackBox"></div>
    <button id="restartBtn">重新开始本轮</button>
    <div class="wrong-title">📋本轮错题对照：</div>
    <div class="wrong-list" id="wrongWords"></div>
</div>

<div class="finish-mask" id="finishMask">
    <div class="finish-box">
        <h2>🎉全部单词练习完毕！</h2>
        <p style="font-size:20px;margin:12px 0">正确：<span id="finRight"></span></p>
        <p style="font-size:20px;margin:12px 0">错误：<span id="finErr"></span></p>
        <p style="font-size:22px;margin:12px 0">最终正确率：<span id="finRate"></span></p>
        <div class="finish‑wrong" id="finishWrongList"></div>
        <button id="closeFinish">再来一轮</button>
    </div>
</div>

let current;
let currentType;
let right=0,err=0;
let wrongRecord=[];
let remainingPool = [];

const hintDom = document.getElementById("showHint");
const inputDom = document.getElementById("inputBox");
const rightDom = document.getElementById("rightCount");
const errDom = document.getElementById("errCount");
const rateDom = document.getElementById("rate");
const remainDom = document.getElementById("remain");
const feedDom = document.getElementById("feedbackBox");
const restartBtn = document.getElementById("restartBtn");
const wrongDom = document.getElementById("wrongWords");
const finishMask = document.getElementById("finishMask");
const finRight = document.getElementById("finRight");
const finErr = document.getElementById("finErr");
const finRate = document.getElementById("finRate");
const finishWrongList = document.getElementById("finishWrongList");
const closeFinish = document.getElementById("closeFinish");

//清洗答案：去除标点符号、多余空格，统一小写
function cleanText(str){
    return str.replace(/[.,!?;:'""，。！？；：]/g,"").trim().toLowerCase();
}

//洗牌打乱
function shuffle(arr){
    let temp = [...arr];
    for(let i=temp.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [temp[i],temp[j]] = [temp[j],temp[i]];
    }
    return temp;
}

function initGame(){
    right=0;err=0;wrongRecord=[];
    remainingPool = shuffle(wordBank);
    rightDom.innerText=0;
    errDom.innerText=0;
    rateDom.innerText="0%";
    remainDom.innerText=remainingPool.length;
    wrongDom.innerText="";
    feedDom.innerText="";
    finishMask.style.display="none";
    nextWord();
}

function nextWord(){
    if(remainingPool.length === 0){
        showFinishReport();
        return;
    }
    current = remainingPool.pop();
    remainDom.innerText = remainingPool.length;
    //随机3种题型：0音标写英文 1中文写英文 2英文写中文
    let r = Math.floor(Math.random()*3);
    currentType = r;
    if(r===0){
        hintDom.innerText = current.phon;
    }else if(r===1){
        hintDom.innerText = current.cn[0];
    }else{
        hintDom.innerText = current.en;
    }
    inputDom.value="";
    feedDom.innerText="";
    inputDom.focus();
}

function showFinishReport(){
    let total = right+err;
    let percent = total>0 ? Math.round((right/total)*100) : 0;
    finRight.innerText = right;
    finErr.innerText = err;
    finRate.innerText = percent+"%";
    finishWrongList.innerText = wrongRecord.join("\n");
    inputDom.blur();
    finishMask.style.display="flex";
}

function checkAnswer(){
    let userRaw = inputDom.value;
    let userClean = cleanText(userRaw);
    let isCorrect = false;
    let showAnswer;
    if(currentType===0 || currentType===1){
        //音标/中文写英文
        let target = cleanText(current.en);
        isCorrect = (userClean === target);
        showAnswer = current.en;
    }else{
        //英文写中文：多个释义答对任意1个即正确
        for(let item of current.cn){
            if(cleanText(item) === userClean){
                isCorrect = true;
                break;
            }
        }
        showAnswer = current.cn.join(" / ");
    }

    if(isCorrect){
        right++;
        feedDom.innerHTML = `<span class="ok">✅回答正确！</span>`;
    }else{
        err++;
        feedDom.innerHTML = `<span class="fail">❌答错啦！正确：${showAnswer}</span>`;
        wrongRecord.push(`题目：${hintDom.innerText}｜正确答案：${showAnswer}`);
        wrongDom.innerText = wrongRecord.join("  \n");
    }
    let total = right+err;
    let percent = total>0 ? Math.round((right/total)*100) : 0;
    rightDom.innerText=right;
    errDom.innerText=err;
    rateDom.innerText=percent+"%";
    setTimeout(nextWord,800);
}

inputDom.addEventListener("keydown",e=>{
    if(e.key==="Enter") checkAnswer();
});

restartBtn.onclick = initGame;
closeFinish.onclick = initGame;

initGame();
