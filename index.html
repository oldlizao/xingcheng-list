body{padding:24px 20px 40px;max-width:980px;margin:0 auto;background:#f5f7fa}
.box{background:#fff;padding:26px 26px 20px;border-radius:14px;box-shadow:0 1px 4px #0002}
.tip{
  color:#8a94a6;
  font-size:13px;
  margin-bottom:16px;
  line-height:1.6;
  padding:10px 14px;
  background:#fdf6ec;

}
.filter-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
    align-items:center;
}
#searchInput{
    width:210px;
    height:30px;
    padding:0 12px;
    border:1px solid #d9dee7;
    border-radius:8px;
    font-size:13px;
    outline:none;
    transition:border .15s, box-shadow .15s;
}
#searchInput:focus{border-color:#4b7bec;box-shadow:0 0 0 3px #4b7bec1a}
/* 多选下拉组件 */
.multi-select-act{
    position:relative;
    width:150px;
}
.multi-trigger{
    height:30px;
    line-height:28px;
    padding:0 10px;
    border:1px solid #d9dee7;
    border-radius:8px;
    background:#fff;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:border .15s;
}
.multi-trigger:hover{border-color:#4b7bec}
.multi-dropdown{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    z-index:100;
    width:100%;
    background:#fff;
    border:1px solid #e2e6ee;
    border-radius:10px;
    max-height:230px;
    overflow-y:auto;
    box-shadow:0 6px 20px rgba(15,23,42,0.14);
    padding:6px 4px;
}
.multi-dropdown.show{
    display:block;
}
.multi-dropdown label{
    display:block;
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    cursor:pointer;
}
.multi-dropdown label:hover{
    background:#f5f7fa;
}
.filter-row select{
    height:30px;
    font-size:13px;
    padding:0 8px;
    border:1px solid #d9dee7;
    border-radius:8px;
    background:#fff;
    outline:none;
    cursor:pointer;
}
.filter-row select:focus{border-color:#4b7bec}
#resetBtn,
#weekBtn{
    height:30px;
    font-size:13px;
    padding:0 14px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid #d9dee7;
    background:#fff;
    color:#444;
    transition:all .15s;
}
#resetBtn:hover{border-color:#94a3b8;background:#f8fafc}
#weekBtn{
    border:none;
    background:linear-gradient(135deg,#4b7bec,#6c5ce7);
    color:#fff;
    font-weight:500;
    box-shadow:0 2px 6px #4b7bec44;
}
#weekBtn:hover{filter:brightness(1.08)}
.count-tip{
    color:#98a2b3;
    font-size:12.5px;
    margin-bottom:10px;
}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #e6eaf1;border-radius:10px;overflow:hidden}
th,td{
    border:none;
    border-bottom:1px solid #eef1f6;
    padding:11px 12px;
    font-size:13px;
    vertical-align: middle;
}
thead th{
    background:#f2f5fa;
    text-align:center;
    font-weight:600;
    color:#334155;
    border-bottom:1px solid #e2e8f0;
    position:sticky;
    top:0;

tbody td:nth-child(1),
tbody td:nth-child(3),
tbody td:nth-child(4){
    text-align:center;
}
tbody td:nth-child(2),
tbody td:nth-child(5){
    text-align:left;
}
td:nth-child(5){
    text-align:left;
    max-width:380px;
    white-space:normal;
    word-break:break-all;
    line-height:1.5;
    color:#475569;

tbody tr{transition:background .12s}
tbody tr:hover{background:#f2f7ff}
tbody tr:last-child td{border-bottom:none}
.date-cell b{font-weight:600;color:#0f172a}
.date-cell .wk{color:#94a3b8;font-size:12px;margin-left:4px}
.date-cell.today b{color:#4b7bec}
.date-cell.today .wk{color:#4b7bec}

th:nth-child(2),td:nth-child(2){width:230px;}
th:nth-child(3),td:nth-child(3){width:100px;}

th:nth-child(5),td:nth-child(5){width:250px;}

.updated{margin-top:16px;text-align:right;color:#98a2b3;font-size:12.5px;}

/* ============ 一周活动弹窗 ============ */
.week-modal{

    width:94%;

.week-head{

    gap:10px;

}
.week-title{
    font-size:18px;

}
.week-title .range{font-size:13px;color:#64748b;font-weight:400;margin-left:8px}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{
    height:28px;
    padding:0 14px;
    font-size:13px;
    border:1px solid #d9dee7;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    color:#475569;
    transition:all .15s;

.week-nav button:hover{border-color:#4b7bec;color:#4b7bec}
.week-nav button.cur{
    background:#4b7bec;
    border-color:#4b7bec;
    color:#fff;
    font-weight:500;
}
.week-close{
    padding:7px 16px;
    cursor:pointer;
    border:none;
    background:#e2e8f0;
    color:#334155;
    border-radius:8px;
    font-size:13px;
    margin-left:6px;
}
.week-close:hover{background:#cbd5e1}
/* 周历横向星期布局 */
.week-calendar-wrap{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:8px;
}
@media (max-width:760px){
    .week-calendar-wrap{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

.week-day-col{

.week-day-head{

.week-item{

.week-item-place{

const multiWrap = document.querySelector('.multi-select-act');
const multiTrigger = multiWrap.querySelector('.multi-trigger');
const multiDrop = multiWrap.querySelector('.multi-dropdown');
let selectedActList = [];

multiTrigger.addEventListener('click',e=>{
    e.stopPropagation();
    multiDrop.classList.toggle('show');
});
multiDrop.addEventListener('click',e=>{
    e.stopPropagation();
});
document.addEventListener('click',()=>{
    multiDrop.classList.remove('show');
});

const checkAll = multiDrop.querySelectorAll('input[type="checkbox"]');
checkAll.forEach(cb=>{
    cb.addEventListener('change',()=>{
        selectedActList = Array.from(checkAll).filter(i=>i.checked).map(i=>i.value);
        multiTrigger.innerText = selectedActList.length === 0 ? "全部活动" : selectedActList.join('、');
        render();
    })
})

resetBtn.addEventListener('click',()=>{

    areaSelect.value = "";
    yearSelect.value = "";
    monthSelect.value = "";
    selectedActList = [];
    checkAll.forEach(cb=>cb.checked = false);
    multiTrigger.innerText = "全部活动";

});

function getAreaByCity(cityName){
    let name = cityName.trim();
    for(let areaName in areaMap){
        if(areaMap[areaName].some(c=>name.includes(c))) return areaName;
    }
    return "其他";
}

function fmtTodayKey(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const todayKey = fmtTodayKey();
const weekNameArr = ['周日','周一','周二','周三','周四','周五','周六'];

function render(){
  let kwText = searchInput.value.trim().toLowerCase();
  let areaFilter = areaSelect.value;
  let yearFilter = yearSelect.value;
  let monthFilter = monthSelect.value;
  let keywords = kwText ? kwText.split(/\s+/).filter(x=>x) : [];
  let arr = [...eventList].sort((a,b)=> new Date(a.date) - new Date(b.date));

  arr = arr.filter(item=>{
    if(areaFilter && getAreaByCity(item.city) !== areaFilter) return false;
    let [y,m] = item.date.split('-');
    if(yearFilter && y !== yearFilter) return false;
    if(monthFilter && m !== monthFilter) return false;
    if(keywords.length){
      const allText = (item.artist + item.city + item.activity + item.remark).toLowerCase();
      if(!keywords.some(word=> allText.includes(word))) return false;
    }
    if(selectedActList.length && !selectedActList.some(sel=> item.activity.includes(sel))) return false;
    return true;
  });

  document.getElementById('countTip').textContent =
      '共 '+arr.length+' 条活动' + (arr.length?'，其中 '+(new Set(arr.map(i=>i.date))).size+' 个日期':'');

  tableBody.innerHTML = "";
  if(arr.length === 0){
    tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">没有符合条件的活动，换个条件试试～</td></tr>';
    return;
  }
  arr.forEach(row=>{
    let tr = document.createElement('tr');
    let wk = weekNameArr[new Date(row.date.replace(/-/g,'/')).getDay()];
    let isToday = row.date === todayKey;
    tr.innerHTML = `
      <td class="date-cell${isToday?' today':''}"><b>${row.date}</b><span class="wk">${wk}${isToday?' · 今天':''}</span></td>
      <td>${row.artist}</td>
      <td>${row.city}</td>
      <td>${row.activity}</td>
      <td>${row.remark || ""}</td>
    `;
    tableBody.appendChild(tr);
  })
}

searchInput.addEventListener('input',render);
areaSelect.addEventListener('change',render);
yearSelect.addEventListener('change',render);
monthSelect.addEventListener('change',render);
render();

// =====================【一周活动：自动根据上方 eventList 生成，无需手动维护】=====================
const weekBtn = document.getElementById('weekBtn');
const weekModal = document.getElementById('weekModal');
const weekClose = document.getElementById('weekClose');
const weekRenderBox = document.getElementById('weekRenderBox');
const weekRange = document.getElementById('weekRange');
const weekPrev = document.getElementById('weekPrev');
const weekNext = document.getElementById('weekNext');
const weekCur = document.getElementById('weekCur');
let weekOffset = 0; // 0=本周，正数=往后，负数=往前

function getMonday(d){
    const day = (d.getDay()+6)%7; // 周一=0
    const m = new Date(d);
    m.setDate(d.getDate()-day);
    m.setHours(0,0,0,0);
    return m;
}

function buildWeekData(offset){
    const mon = getMonday(new Date());
    mon.setDate(mon.getDate()+offset*7);
    const days = [];
    for(let i=0;i<7;i++){
        const d = new Date(mon);
        d.setDate(mon.getDate()+i);
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const list = eventList
            .filter(e=>e.date===key)
            .sort((a,b)=>a.city.localeCompare(b.city,'zh'))
            .map(e=>({
                name:e.artist,
                act:e.activity,
                place:e.city
            }));
        days.push({
            dayTitle:'星期'+'一二三四五六日'[i],
            dateText:(d.getMonth()+1)+'/'+d.getDate(),
            key:key,
            list:list
        });
    }
    return days;
}

function renderWeekCalendar(){
    const data = buildWeekData(weekOffset);
    const first = data[0], last = data[6];
    weekRange.textContent = first.dateText + ' - ' + last.dateText + (weekOffset===0?'（本周）':weekOffset===1?'（下周）':weekOffset===-1?'（上周）':'');
    weekCur.classList.toggle('cur', weekOffset===0);

    let html = '<div class="week-calendar-wrap">';
    data.forEach(day=>{
        const isToday = day.key === todayKey;
        html += `<div class="week-day-col${isToday?' is-today':''}">
            <div class="week-day-head">
                <div class="day-name">${day.dayTitle}</div>
                <div class="day-date">${day.dateText}</div>
                ${isToday?'<div class="today-badge">今天</div>':''}
            </div>
            <div class="week-day-body">`;
        if(day.list.length === 0){
            html += '<div class="week-day-empty">暂无</div>';
        }else{
            day.list.forEach(act=>{
                html += `<div class="week-item">
                    <div class="week-item-name">${act.name}<span class="act">${act.act}</span></div>
                    <div class="week-item-place">${act.place}</div>
                </div>`;
            });
        }
        html += '</div></div>';
    });
    html += '</div>';
    weekRenderBox.innerHTML = html;
}

weekBtn.onclick = function(){
    weekOffset = 0;
    renderWeekCalendar();
    weekModal.classList.add('show');
}
weekPrev.onclick = function(){ weekOffset--; renderWeekCalendar(); }
weekNext.onclick = function(){ weekOffset++; renderWeekCalendar(); }
weekCur.onclick = function(){ weekOffset = 0; renderWeekCalendar(); }
weekClose.onclick = function(){
    weekModal.classList.remove('show');
}
weekModal.onclick = function(e){
    if(e.target === weekModal) weekModal.classList.remove('show');
}
document.addEventListener('keydown',e=>{
    if(e.key==='Escape') weekModal.classList.remove('show');
});
</script>
