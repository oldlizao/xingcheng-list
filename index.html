<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Microsoft Yahei}
body{padding:20px;max-width:980px;margin:0 auto;background:#f5f7fa}
.box{background:#fff;padding:22px;border-radius:10px;box-shadow:0 1px 4px #0002}
.filter-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    align-items:center;
}
#searchInput{
    width:280px;
}
table{width:100%;border-collapse:collapse}
th,td{
    border:1px solid #ddd;
    padding:12px 10px;
    font-size:13px;
    vertical-align: middle;
}
th{
    background:#eef2f7 !important;
    text-align:center;
    font-weight:bold;
}
/* 日期、城市、活动居中 */
td:nth-child(1),
td:nth-child(3),
td:nth-child(4){
    text-align:center;
}
/* 艺人列左对齐+换行 */
td:nth-child(2) {
    text-align:left;
    white-space: normal;
    word-break: break-all;
    line-height: 1.5;
}
/* 备注列左对齐 + 强制自动换行，解决长名单溢出 */
td:nth-child(5){
    text-align:left;
    max-width: 380px;
    white-space: normal;
    word-break: break-all;
    line-height: 1.5;
}
tr:hover{background:#f7f9fc}
/*斑马隔行底色，可选，不想要可以删掉下面一行*/
tbody tr:nth-child(even){background-color:#f9fafc;}
.tip{color:#666;font-size:13px;margin-bottom:12px}
th:nth-child(1),td:nth-child(1){width:120px;}   /*日期*/
th:nth-child(2),td:nth-child(2){width:230px;}  /*艺人*/
th:nth-child(3),td:nth-child(3){width:100px;}  /*城市*/
th:nth-child(4),td:nth-child(4){width:100px;}  /*活动类型*/
th:nth-child(5),td:nth-child(5){width:250px;}  /*备注*/

/* ==========只控制下面的数据单元格，表头不动！========== */
tbody td:nth-child(1),
tbody td:nth-child(3),
tbody td:nth-child(4)
{
    text-align:center;
}
tbody td:nth-child(2),
tbody td:nth-child(5)
{
    text-align:left;
}


</style>
</head>

  {date:"2026-10-04", artist:"王允宸", city:"上海", activity:"音乐剧", remark:"四大美女"},

  {date:"2026-10-07", artist:"陈珂", city:"长沙", activity:"演出", remark:"/"},
  {date:"2026-10-17", artist:"刘力菲 张昕", city:"北京", activity:"演出", remark:"/"},

const searchInput = document.getElementById('searchInput');
const selActivity = document.getElementById('selActivity');
const tableBody = document.getElementById('tableBody');
const areaSelect = document.getElementById('areaSelect');
const yearSelect = document.getElementById('yearSelect');
const monthSelect = document.getElementById('monthSelect');

// =========大区城市对照表=========
const areaMap = {
  "京津冀":["北京","天津","石家庄","唐山","秦皇岛","邯郸","邢台","保定","张家口","承德","沧州","廊坊","衡水"],
  "江浙沪皖":["上海","南京","无锡","徐州","常州","苏州","南通","连云港","淮安","盐城","扬州","镇江","泰州","宿迁","杭州","宁波","温州","嘉兴","湖州","绍兴","金华","衢州","舟山","台州","丽水","合肥","芜湖","蚌埠","淮南","马鞍山","淮北","铜陵","安庆","黄山","滁州","阜阳","宿州","六安","亳州","池州","宣城"],
  "闽粤桂湘":["福州","厦门","莆田","三明","泉州","漳州","南平","龙岩","宁德","广州","深圳","珠海","汕头","佛山","韶关","湛江","肇庆","江门","茂名","惠州","梅州","汕尾","河源","阳江","清远","东莞","中山","潮州","揭阳","云浮","南宁","柳州","桂林","梧州","北海","防城港","钦州","贵港","玉林","百色","贺州","河池","来宾","崇左","长沙","株洲","湘潭","衡阳","邵阳","岳阳","常德","张家界","益阳","郴州","永州","怀化","娄底","湘西"],
  "云贵川渝":["昆明","曲靖","玉溪","保山","昭通","丽江","普洱","临沧","楚雄","红河","文山","西双版纳","大理","德宏","怒江","迪庆","贵阳","六盘水","遵义","安顺","毕节","铜仁","黔西南","黔东南","黔南","成都","自贡","攀枝花","泸州","德阳","绵阳","广元","遂宁","内江","乐山","南充","眉山","宜宾","广安","达州","雅安","巴中","资阳","阿坝","甘孜","凉山","重庆"],
  "港澳台":["中国香港","中国澳门","中国台湾"],
  "其他":["太原","呼和浩特","沈阳","大连","长春","哈尔滨","南昌","济南","青岛","郑州","武汉","拉萨","西安","兰州","西宁","银川","乌鲁木齐"]
};

// 根据城市自动算出大区
function getAreaByCity(cityName){
    let name = cityName.trim();
    for(let areaName in areaMap){
        let cityArr = areaMap[areaName];
        for(let c of cityArr){
            //模糊包含匹配，只要文字里面含有地级市名字就命中大区
            if(name.includes(c)){
                return areaName;
            }
        }
    }
    return "其他";
}


function render(){
  let kwText = searchInput.value.trim().toLowerCase();
  let actFilter = selActivity.value;
  let areaFilter = areaSelect.value;
  let yearFilter = yearSelect.value;
  let monthFilter = monthSelect.value;


  // 空格分割，支持多关键词
  let keywords = kwText ? kwText.split(/\s+/).filter(x=>x) : [];

  // 永远按日期升序排序
  let arr = [...eventList].sort((a,b)=>{
    return new Date(a.date) - new Date(b.date);
  });

  arr = arr.filter(item=>{
    //====新增地区校验====
    let cityArea = getAreaByCity(item.city);
    let areaOk = areaFilter === "" || cityArea === areaFilter;
    if(!areaOk) return false;
// ==========新增 年份月份筛选 ==========
    let [y,m] = item.date.split('-');
    if(yearFilter && y !== yearFilter) return false;
    if(monthFilter && m !== monthFilter) return false;

    //多关键词匹配: 任意一个关键词命中艺人/城市/活动即可显示
    if(keywords.length>0){
      const allText = (item.artist + item.city + item.activity + item.remark).toLowerCase();
      let hit = keywords.some(word=> allText.includes(word));
      if(!hit) return false;
    }
    //活动下拉筛选 (可叠加)
    if(actFilter && item.activity!==actFilter) return false;
    return true;
});


  tableBody.innerHTML = "";
  arr.forEach(row=>{
    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${row.date}</td>
      <td>${row.artist}</td>
      <td>${row.city}</td>
      <td>${row.activity}</td>
      <td>${row.remark || ""}</td>
    `;
    tableBody.appendChild(tr);
  })
}

searchInput.addEventListener('input',render);
selActivity.addEventListener('change',render);
areaSelect.addEventListener('change',render);
yearSelect.addEventListener('change',render);
monthSelect.addEventListener('change',render);

render();
</script>
